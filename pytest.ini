[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    traza(*ids): enlaza la prueba con historias de usuario (US-xx), casos de uso (CU-xx) y ADR (ADR-xxx)
    integracion: prueba que usa base de datos real (SQLite en memoria o PostgreSQL con TEST_DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning
