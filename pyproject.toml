[project]
name = "medinova"
version = "1.0.0"
description = "MediNova: agenda de citas multi-sucursal (DDD, Specification, State Machine, API REST)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E702", "B008", "UP037", "UP046", "UP007", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017", "E731", "I001"]
"src/domain/eventos.py" = ["E701"]
